<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAgent Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Titlebar -->
    <div id="titlebar">
        <div class="title"><span class="accent">OmniAgent</span> Studio</div>
        <div class="spacer"></div>
        <div class="version">v0.2.0</div>
    </div>

    <!-- Main App -->
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-item active" data-panel="chat" title="Chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </div>
            <div class="sidebar-spacer"></div>
            <div class="sidebar-item" data-panel="settings" title="Settings" id="settings-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div id="main">
            <div id="chat-area">
                <div id="messages">
                    <!-- Welcome screen -->
                    <div id="welcome" class="welcome">
                        <h1><span class="accent">OmniAgent</span> Studio</h1>
                        <p>自主多Agent协同平台 — 配置 LLM &rarr; 输入任务 &rarr; AI 自动调度最优 Agent 协作完成</p>
                        <div class="quick-actions">
                            <button onclick="submitTask('用React+FastAPI构建一个全栈待办事项应用，包含用户认证和响应式设计')">软件开发</button>
                            <button onclick="submitTask('帮我写一份微服务架构的技术设计文档')">文档写作</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <div id="input-bar">
                <div class="input-row">
                    <div class="mode-selector" id="mode-selector">
                        <button class="mode-btn" data-mode="plan" title="Plan: 只读探索">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
                            Plan
                        </button>
                        <button class="mode-btn active" data-mode="agent" title="Agent: 每步确认">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
                            Agent
                        </button>
                        <button class="mode-btn" data-mode="auto" title="Auto: 全自动">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                            Auto
                        </button>
                    </div>
                    <div class="input-wrapper">
                        <textarea id="user-input" placeholder="Describe your task..." rows="1"></textarea>
                        <button id="send-btn" title="Send (Enter)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="modal-close" id="settings-close">&times;</button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="models">Models</button>
                <button class="modal-tab" data-tab="agents">Agents</button>
                <button class="modal-tab" data-tab="tools">Tools</button>
            </div>
            <div class="modal-body">
                <div class="tab-panel active" id="tab-models">
                    <div class="model-tags" id="model-tags"></div>
                    <div id="model-config"></div>
                </div>
                <div class="tab-panel" id="tab-agents">
                    <div id="agent-list"></div>
                </div>
                <div class="tab-panel" id="tab-tools">
                    <div id="tool-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div id="statusbar">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Ready</span>
        <span class="spacer"></span>
        <span id="model-status">No LLM configured</span>
        <span class="spacer"></span>
        <span id="agent-count"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
