<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniAgent Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-primary:#0d1117;
  --bg-secondary:#161b22;
  --bg-tertiary:#21262d;
  --border:#30363d;
  --text-primary:#e6edf3;
  --text-secondary:#8b949e;
  --accent:#58a6ff;
  --success:#3fb950;
  --warning:#d29922;
  --error:#f85149;
  --thinking:#a371f7;
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
header{
  background:var(--bg-secondary);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:12px;
}
header .logo{font-size:18px;font-weight:700}
header .logo span{color:var(--accent)}
header .version{font-size:11px;color:var(--text-secondary);background:var(--bg-tertiary);padding:2px 8px;border-radius:10px}
header .spacer{flex:1}
header button{
  background:var(--accent);color:#fff;border:none;padding:8px 20px;
  border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;
}
header button:hover{opacity:.85}
header button:disabled{opacity:.4;cursor:default}
header button.reset-btn{background:var(--bg-tertiary);color:var(--text-primary)}
main{flex:1;display:flex;overflow:hidden}
aside{
  width:220px;min-width:220px;background:var(--bg-secondary);
  border-right:1px solid var(--border);padding:12px 0;display:flex;flex-direction:column;
}
aside.right{border-right:none;border-left:1px solid var(--border);width:320px}
.section-title{
  font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--text-secondary);padding:8px 16px 4px;
}
.agent-item{
  padding:8px 16px;font-size:12px;display:flex;align-items:center;gap:8px;
  border-left:2px solid transparent;transition:all .15s;
}
.agent-item:hover{background:var(--bg-tertiary)}
.agent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text-secondary)}
.agent-dot.running{background:var(--success);animation:pulse .8s infinite}
.agent-dot.done{background:var(--accent)}
.agent-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-caps{font-size:10px;color:var(--text-secondary)}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pipeline{flex:1;padding:20px 30px;overflow-y:auto}
.pipeline h2{font-size:14px;margin-bottom:16px;color:var(--text-secondary)}
.stages{display:flex;flex-direction:column;gap:6px}
.stage{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:var(--bg-secondary);
  border:1px solid var(--border);border-radius:8px;transition:all .4s;
}
.stage.running{border-color:var(--accent);background:#1a2332;box-shadow:0 0 12px rgba(88,166,255,.15)}
.stage.completed{border-color:var(--success);opacity:.75}
.stage .stage-icon{font-size:20px;width:32px;text-align:center}
.stage .stage-status{font-size:16px;width:24px}
.stage .stage-info{flex:1}
.stage .stage-name{font-size:13px;font-weight:500}
.stage .stage-agent{font-size:11px;color:var(--text-secondary)}
.event-log{flex:1;overflow-y:auto;padding:8px 0}
.event-item{
  padding:5px 16px;font-size:11px;font-family:'Cascadia Code',Consolas,monospace;
  border-bottom:1px solid var(--bg-tertiary);animation:slide .2s;
}
.event-item .evt-time{color:var(--text-secondary);margin-right:8px}
.event-item.info{color:var(--text-secondary)}
.event-item.success{color:var(--success)}
.event-item.error{color:var(--error)}
.event-item.thinking{color:var(--thinking)}
.event-item.system{color:var(--accent);font-weight:600}
footer{
  background:var(--bg-secondary);border-top:1px solid var(--border);
  padding:6px 20px;font-size:11px;color:var(--text-secondary);
  display:flex;align-items:center;gap:20px;
}
footer .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>

<header>
  <div class="logo">🎯 <span>OmniAgent</span> Studio</div>
  <div class="version">v0.2.0</div>
  <div class="spacer"></div>
  <button id="btn-run" onclick="runDemo()">▶ 运行 Demo</button>
  <button class="reset-btn" onclick="resetAll()">↺ 重置</button>
</header>

<main>
  <aside id="agents-panel">
    <div class="section-title">🤖 Agent 列表</div>
    <div id="agent-list"></div>
  </aside>

  <div class="center">
    <div class="pipeline">
      <h2>🔄 Task Pipeline</h2>
      <div class="stages" id="pipeline-stages">
        <div class="stage" id="stage-0"><div class="stage-status">⬜</div><div class="stage-icon">📋</div><div class="stage-info"><div class="stage-name">需求确认</div><div class="stage-agent" id="stage-agent-0"></div></div></div>
        <div class="stage" id="stage-1"><div class="stage-status">⬜</div><div class="stage-icon">🔬</div><div class="stage-info"><div class="stage-name">需求分析</div><div class="stage-agent" id="stage-agent-1"></div></div></div>
        <div class="stage" id="stage-2"><div class="stage-status">⬜</div><div class="stage-icon">🎨</div><div class="stage-info"><div class="stage-name">原型设计</div><div class="stage-agent" id="stage-agent-2"></div></div></div>
        <div class="stage" id="stage-3"><div class="stage-status">⬜</div><div class="stage-icon">💻</div><div class="stage-info"><div class="stage-name">前端开发</div><div class="stage-agent" id="stage-agent-3"></div></div></div>
        <div class="stage" id="stage-4"><div class="stage-status">⬜</div><div class="stage-icon">⚙️</div><div class="stage-info"><div class="stage-name">后端开发</div><div class="stage-agent" id="stage-agent-4"></div></div></div>
        <div class="stage" id="stage-5"><div class="stage-status">⬜</div><div class="stage-icon">🧪</div><div class="stage-info"><div class="stage-name">测试</div><div class="stage-agent" id="stage-agent-5"></div></div></div>
        <div class="stage" id="stage-6"><div class="stage-status">⬜</div><div class="stage-icon">🚀</div><div class="stage-info"><div class="stage-name">部署上线</div><div class="stage-agent" id="stage-agent-6"></div></div></div>
      </div>
    </div>
  </div>

  <aside class="right">
    <div class="section-title">📋 事件日志</div>
    <div class="event-log" id="event-log"></div>
  </aside>
</main>

<footer>
  <div class="dot" id="status-dot"></div>
  <span id="status-text">就绪</span>
  <span style="flex:1"></span>
  <span id="progress-text"></span>
</footer>

<script>
const MAX_EVENTS = 150;
let pollTimer = null;
let eventCount = 0;

// ── Init ──
async function initAgents() {
  try {
    const raw = await pywebview.api.get_agents();
    const agents = JSON.parse(raw);
    const el = document.getElementById('agent-list');
    el.innerHTML = agents.map(a => `
      <div class="agent-item" id="agent-${a.id}">
        <div class="agent-dot idle"></div>
        <div class="agent-info">
          <div class="agent-name">${a.name}</div>
          <div class="agent-caps">${(a.capabilities||[]).slice(0,2).join(', ')}</div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    console.error('Failed to load agents:', e);
  }
}
initAgents();

// ── Demo ──
async function runDemo() {
  const btn = document.getElementById('btn-run');
  btn.disabled = true;
  btn.textContent = '⏳ 运行中...';
  updateStatus('运行中', 'running');
  resetPipeline();

  try {
    await pywebview.api.run_demo();
    startPolling();
  } catch(e) {
    addEvent('system', 'Error: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '▶ 运行 Demo';
  }
}

// ── Polling ──
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const raw = await pywebview.api.poll_events();
      const events = JSON.parse(raw);
      for (const evt of events) {
        if (evt.type === 'event') {
          addEvent(evt.source, evt.message, evt.level);
        } else if (evt.type === 'action') {
          handleAction(evt);
        }
      }
      const status = JSON.parse(await pywebview.api.get_status());
      if (!status.running) stopPolling();
    } catch(e) {}
  }, 200);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  document.getElementById('btn-run').disabled = false;
  document.getElementById('btn-run').textContent = '▶ 运行 Demo';
  updateStatus('完成', 'idle');
}

// ── Actions ──
function handleAction(evt) {
  if (evt.action === 'stage_update') {
    setStage(evt.index, evt.status, evt.agent || '');
    if (evt.agent) setAgentStatus(evt.agent, evt.status);
  } else if (evt.action === 'demo_complete') {
    stopPolling();
  }
}

// ── UI Updates ──
function addEvent(source, message, level) {
  const el = document.getElementById('event-log');
  const now = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  const icons = {
    system:'⚙️', orchestrator:'🎯', info:'ℹ️', success:'✅',
    warning:'⚠️', error:'❌', thinking:'🧠',
    'code-gen-agent':'💻', 'code-review-agent':'🔍',
    'doc-writer-agent':'📝', 'test-agent':'🧪', 'general-agent':'🤖'
  };
  const icon = icons[source] || icons[level] || '•';
  const div = document.createElement('div');
  div.className = 'event-item ' + level;
  div.innerHTML = `<span class="evt-time">${now}</span>${icon} ${message}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  if (++eventCount > MAX_EVENTS) el.firstChild?.remove();
  updateProgress();
}

function setStage(index, status, agent) {
  const stage = document.getElementById('stage-' + index);
  if (!stage) return;
  stage.className = 'stage ' + status;
  const icons = {pending:'⬜', running:'⚡', completed:'✅', failed:'❌'};
  const statusEl = stage.querySelector('.stage-status');
  if (statusEl) statusEl.textContent = icons[status] || '⬜';
  const agentEl = document.getElementById('stage-agent-' + index);
  if (agentEl && agent) agentEl.textContent = '→ ' + agent.replace('Agent','').trim();
}

function setAgentStatus(id, status) {
  const el = document.getElementById('agent-' + id);
  if (!el) return;
  el.querySelector('.agent-dot').className = 'agent-dot ' + status;
}

function updateProgress() {
  const done = document.querySelectorAll('.stage.completed').length;
  const total = 7;
  document.getElementById('progress-text').textContent = done ? `Stage ${Math.min(done+1,total)}/${total}` : '';
}

function updateStatus(text, type) {
  document.getElementById('status-text').textContent = text;
  const dot = document.getElementById('status-dot');
  dot.style.background = type === 'running' ? 'var(--warning)' : 'var(--success)';
}

function resetPipeline() {
  document.getElementById('event-log').innerHTML = '';
  eventCount = 0;
  document.querySelectorAll('.stage').forEach(s => { s.className = 'stage'; });
  document.querySelectorAll('.stage-status').forEach(s => { s.textContent = '⬜'; });
  document.querySelectorAll('.stage-agent').forEach(s => { s.textContent = ''; });
  document.querySelectorAll('.agent-dot').forEach(d => { d.className = 'agent-dot idle'; });
  document.getElementById('progress-text').textContent = '';
  updateStatus('就绪', 'idle');
}

function resetAll() {
  stopPolling();
  resetPipeline();
  document.getElementById('btn-run').disabled = false;
  document.getElementById('btn-run').textContent = '▶ 运行 Demo';
}
</script>
</body>
</html>
